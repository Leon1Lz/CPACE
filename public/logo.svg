<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <!-- CPACE Philippines Brand Logo -->
  <defs>
    <clipPath id="emblem-clip">
      <circle cx="30" cy="40" r="26"/>
    </clipPath>
  </defs>

  <!-- Concentric circle emblem -->
  <g clip-path="url(#emblem-clip)">
    <!-- Outer filled circle -->
    <circle cx="30" cy="40" r="26" fill="#1B6B37"/>
    <!-- Outer crescent cut -->
    <circle cx="38" cy="32" r="20" fill="white"/>
    <!-- Middle filled circle -->
    <circle cx="30" cy="40" r="18" fill="#1B6B37"/>
    <!-- Middle crescent cut -->
    <circle cx="36" cy="34" r="13" fill="white"/>
    <!-- Inner filled circle -->
    <circle cx="30" cy="40" r="11" fill="#1B6B37"/>
    <!-- Inner crescent cut -->
    <circle cx="34" cy="36" r="7" fill="white"/>
  </g>

  <!-- Vertical separator line -->
  <line x1="64" y1="16" x2="64" y2="64" stroke="#1B6B37" stroke-width="1.5"/>

  <!-- CPACE text -->
  <text x="74" y="40" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" fill="#1B6B37" dominant-baseline="central" letter-spacing="2">CPACE</text>
  <text x="74" y="40" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="900" fill="#1B6B37" dominant-baseline="central" dx="142" dy="-8">®</text>

  <!-- Full name text -->
  <text x="74" y="56" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="6.5" font-weight="600" fill="#1B6B37" letter-spacing="1.2" text-transform="uppercase">CENTER FOR PROFESSIONAL ADVANCEMENT</text>
  <text x="74" y="64" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="6.5" font-weight="600" fill="#1B6B37" letter-spacing="1.2" text-transform="uppercase">AND CONTINUING EDUCATION</text>
</svg>
